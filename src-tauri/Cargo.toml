[package]
name = "cloudstream-desktop"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "cloudstream_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
zip-extract = "0.1"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "cookies", "stream", "multipart"] }
rusqlite = { version = "0.31", features = ["bundled"] }
axum = "0.7"
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
async-trait = "0.1"
regex = "1"
scraper = "0.19"
aes = "0.8"
cbc = "0.1"
cipher = "0.4"
base64 = "0.22"
hex = "0.4"
url = "2"
zip = "2"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
urlencoding = "2"
libmpv2 = "6.0.0"
libmpv2-sys = "4.0.1"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3.9", features = [
    "d3d11",
    "d3dcommon",
    "dwmapi",
    "dxgi",
    "dxgiformat",
    "dxgitype",
    "libloaderapi",
    "handleapi",
    "winuser",
    "wingdi",
    "winerror",
    "winnt",
    "minwindef",
] }


# Build optimization: thin LTO provides ~95% of full LTO's perf gain but builds 2-3x faster.
# codegen-units=1 forced single-threaded linking (3.5+ min builds); 16 allows parallelism.
[profile.release]
codegen-units = 16
lto = "thin"
opt-level = 3
panic = "abort"
strip = true
